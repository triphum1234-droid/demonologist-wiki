    <style>
        :root {
            --bg-base: #0d0d11;
            --bg-surface: #16161e;
            --bg-raised: #1e1e28;
            --bg-hover: #252530;
            --border: #2e2e3e;
            --border-light: #3a3a4e;
            --text-primary: #f0f0f4;
            --text-secondary: #b4b4c8;
            --text-muted: #85859b;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Sarabun', 'Inter', sans-serif;
            font-size: 16px;
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
        }
        /* Toggle buttons */
        .toggle-btn {
            transition: all 0.15s ease;
            user-select: none;
            font-family: 'Sarabun', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.01em;
            border-radius: 8px;
            padding: 6px 12px;
        }
        .toggle-btn:hover { transform: translateY(-1px); }
        .toggle-btn:active { transform: translateY(0px) scale(0.98); }
        .toggle-btn:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
        .text-xs { font-size: 0.8125rem; }
        .text-sm { font-size: 0.9375rem; }
        .state-0 { background-color: var(--bg-raised); color: var(--text-secondary); border: 1px solid var(--border-light); }
        .state-0:hover { background-color: var(--bg-hover); color: var(--text-primary); }
        .state-1 { background-color: #065f46; color: #6ee7b7; border: 1px solid #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.25); }
        .state-2 { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; text-decoration: line-through; opacity: 0.85; }
        .state-auto-eliminated { background: rgba(127,29,29,0.2); color: #d89ba3; border: 1px dashed #8b4651; text-decoration: line-through; }
        .state-auto-confirmed { background: rgba(6,95,70,0.16); color: #9ad8bd; border: 1px dashed #16845f; }

        /* Ghost cards */
        .ghost-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .ghost-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #ef4444, #b91c1c);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .ghost-card:hover { transform: translateY(-3px); background-color: var(--bg-raised); border-color: var(--border-light); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .ghost-card:hover::before { opacity: 1; }
        .ghost-card.possible { border-color: #1f3d2e; }
        .ghost-card.possible::before { opacity: 0.4; }
        .ghost-card.impossible { opacity: 0.1; pointer-events: none; filter: grayscale(100%); }

        /* Tags */
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin: 2px 3px 2px 0;
            letter-spacing: 0.02em;
        }
        .tag.evidence { background-color: #1a1a2e; border: 1px solid var(--border-light); color: #b4b4c8; }
        .tag.evidence.match { background-color: #064e3b; color: #6ee7b7; border-color: #059669; }
        .tag.trait { background-color: #2d1f0e; color: #fbbf24; border: 1px solid #78350f; }
        .tag.trait.match { background-color: #78350f; color: #fde68a; border-color: #d97706; }

        /* Nav buttons */
        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Sarabun', sans-serif;
            transition: all 0.15s ease;
            border: 1px solid transparent;
            cursor: pointer;
            white-space: nowrap;
        }
        .nav-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
        .nav-btn-blue { background: #1e3a5f; color: #93c5fd; border-color: #1d4ed8; }
        .nav-btn-blue:hover { background: #1e40af; color: #bfdbfe; }
        .nav-btn-purple { background: #2d1b4e; color: #c4b5fd; border-color: #7c3aed; }
        .nav-btn-purple:hover { background: #4c1d95; color: #ddd6fe; }
        .nav-btn-teal { background: #0f3d35; color: #6ee7b7; border-color: #0d9488; }
        .nav-btn-teal:hover { background: #134e4a; color: #a7f3d0; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #525268; }

        /* Modal */
        .key-highlight {
            background: rgba(245, 158, 11, 0.16);
            border-bottom: 1px solid rgba(245, 158, 11, 0.72);
            border-radius: 3px;
            color: #fde68a;
            font-weight: 700;
            padding: 0 0.12em;
            -webkit-box-decoration-break: clone;

        }
        .modal-copy { font-size: 15px; line-height: 1.8; }
        .modal-backdrop { background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); }

    </style>

                name: "Gul", evidence: ["Fingerprints", "Spirit Box", "Freezing"], traits: ["เกลียดเสียงพูดคุย", "การสบถใกล้ผีทำให้โกรธและอาจเริ่ม Hunt"],
                details: {
                    concept: "อสูรกายแห่งความป่าเถื่อน (Ghoul) คล้ายกับ Yokai ที่มีขีดจำกัดความอดทนต่ำต่อเสียงรบกวน",
                    visuals: "พฤติกรรมคล้าย Yokai คือเมื่อมีการพูดคุยหรือทำเสียงดัง มันจะโกรธด้วยการหลอกหรือปาของ และอาจเริ่มล่าแม้ Sanity ยังสูง",
                    technique: "สามารถใช้วิธีทดสอบเสียง (ไมโครโฟน) เหมือนกับ Yokai ความแตกต่างระหว่าง Gul กับ Yokai มักจะอยู่ที่การหาหลักฐานชิ้นอื่นมาประกอบ",
                    application: "เมื่อสงสัยว่าเป็น Gul หรือ Yokai ให้บังคับใช้มาตรการ 'ปิดไมค์' ในพื้นที่เสี่ยงทันที จะช่วยให้การสำรวจปลอดภัยขึ้นมาก"
                }
            },
            { 
                name: "Spirit", evidence: ["EMF Level 5", "Spirit Box", "Freezing"], traits: ["หยุดล่านานผิดปกติหลังใช้ธูป"],
                details: {
                    concept: "วิญญาณมาตรฐานที่ไม่มีพลังพิเศษ ทำให้มันเป็นหนึ่งในผีที่เดาทางยากที่สุดจากการสังเกตด้วยตาเปล่า",
                    visuals: "มันจะไม่มีพฤติกรรมอะไรที่สุดโต่งเลย การหลอกหลอนและการล่าจะอยู่ในเกณฑ์มาตรฐานตามระดับ Sanity ที่ลดลง",
                    technique: "ไม้ตายเดียวในการพิสูจน์ Spirit คือ 'ไม้หอม (Smudge Sticks)' ปกติเมื่อเผาใส่ผีตัวอื่น มันจะหยุดล่า 90 วิ แต่สำหรับ Spirit มันจะสงบลงนานถึง 180 วินาที",
                    application: "เมื่อสงสัย Spirit ให้ใช้ธูปจุดใส่ห้องมัน แล้วจับเวลา หากบ้านเงียบสนิทไม่มีทีท่าว่าจะล่าเกิน 2 นาทีครึ่ง คุณก็สามารถมั่นใจได้เลย"
                }
            }
        ].sort((a, b) => a.name.localeCompare(b.name));

        const highlightTerms = Array.from(new Set([
            ...evidenceTypes,
            ...traitTypes,
            ...ghosts.map(ghost => ghost.name),
            "Ghost Room", "Freezing Temperature", "Ghost Manifestation", "Smudge Sticks",
            "Ouija Board", "Tarot Cards", "Voodoo Doll", "Sanity Pills", "Crucifix",
            "Thermometer", "Flashlight", "Fingerprints", "Spirit Box", "Ectoplasm",
            "Easel Canvas", "Hunt", "Sanity", "ESG", "EMF", "Salt", "UV",
            "ธูป", "เทียน", "รอยนิ้วมือ", "รอยเท้า", "ห้องผี", "ปิดไมค์"
        ])).filter(Boolean).sort((a, b) => b.length - a.length);
        const highlightPattern = new RegExp(`(${highlightTerms.map(term => term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})`, "gi");

        function App() {
            const [evidenceState, setEvidenceState] = React.useState(
                evidenceTypes.reduce((acc, ev) => ({ ...acc, [ev]: 0 }), {})
            );
            const [traitState, setTraitState] = React.useState(
                traitTypes.reduce((acc, t) => ({ ...acc, [t]: 0 }), {})
            );
            
            const [expandedTraitGroups, setExpandedTraitGroups] = React.useState({});
            const [selectedGhost, setSelectedGhost] = React.useState(null);
            const [showEvidenceModal, setShowEvidenceModal] = React.useState(false);
            const [showCursedModal, setShowCursedModal] = React.useState(false);
            const [showStoreModal, setShowStoreModal] = React.useState(false); // NEW STATE

            const toggleEvidence = (ev) => setEvidenceState(prev => ({ ...prev, [ev]: (prev[ev] + 1) % 3 }));
            const toggleTrait = (t) => setTraitState(prev => ({ ...prev, [t]: (prev[t] + 1) % 3 }));

            const reset = () => {
                setEvidenceState(evidenceTypes.reduce((acc, ev) => ({ ...acc, [ev]: 0 }), {}));
                setTraitState(traitTypes.reduce((acc, t) => ({ ...acc, [t]: 0 }), {}));
            };

            const checkGhost = (ghost) => {
                for (let ev of evidenceTypes) {
                    if (evidenceState[ev] === 1 && !ghost.evidence.includes(ev)) return false;
                    if (evidenceState[ev] === 2 && ghost.evidence.includes(ev)) return false;
                }
                for (let t of traitTypes) {
                    const hasTrait = ghost.traits && ghost.traits.includes(t);
                    if (traitState[t] === 1 && !hasTrait) return false;
                    if (traitState[t] === 2 && hasTrait) return false;
                }
                return true;
            };

            const possibleGhosts = ghosts.filter(checkGhost);


            const activeFilterEntries = [
                ...evidenceTypes.map(label => ({ label, value: evidenceState[label] })),
                ...traitTypes.map(label => ({ label, value: traitState[label] }))
            ].filter(item => item.value !== 0);
            const activeFilterCount = activeFilterEntries.length;

            const getFilterAvailability = (kind, label, state) => {
                if (state !== 0 || activeFilterCount === 0 || possibleGhosts.length === 0) return null;
                const matchingCount = possibleGhosts.reduce((count, ghost) => {
                    const hasOption = kind === "evidence"
                        ? ghost.evidence.includes(label)
                        : !!(ghost.traits && ghost.traits.includes(label));
                    return count + (hasOption ? 1 : 0);
                }, 0);
                if (matchingCount === 0) return "eliminated";
                if (matchingCount === possibleGhosts.length) return "confirmed";
                return null;
            };

            const autoEliminatedCount = [
                ...evidenceTypes.map(label => getFilterAvailability("evidence", label, evidenceState[label])),
                ...traitTypes.map(label => getFilterAvailability("trait", label, traitState[label]))
            ].filter(status => status === "eliminated").length;

            const renderFilterChoice = (kind, label, state, onClick) => {
                const availability = getFilterAvailability(kind, label, state);
                const stateClass = availability === "eliminated"
                    ? "state-auto-eliminated"
                    : availability === "confirmed" ? "state-auto-confirmed" : `state-${state}`;
                const statusText = availability === "eliminated"
                    ? "ตัดออกอัตโนมัติ: ไม่มีในผีที่เหลือ"
                    : availability === "confirmed" ? "ยืนยันอัตโนมัติ: พบในผีที่เหลือทุกตัว"
                    : state === 1 ? "เลือกว่าพบแน่นอน"
                    : state === 2 ? "เลือกว่าต้องไม่มี"
                    : "คลิกเพื่อวนสถานะ: ยังไม่เลือก, ต้องพบ, ต้องไม่มี";
                const icon = availability === "eliminated" ? "✕" : availability === "confirmed" ? "✓" : null;
                return (
                    <button key={label} type="button" title={statusText} aria-label={`${label} — ${statusText}`} onClick={onClick} className={`toggle-btn ${stateClass}`}>
                        {icon && <span aria-hidden="true" className="mr-1 font-black">{icon}</span>}{label}
                    </button>
                );
            };

            const renderHighlightedText = (value) => {
                const text = String(value ?? "");
                const parts = [];
                let cursor = 0;
                for (const match of text.matchAll(highlightPattern)) {
                    if (match.index > cursor) parts.push(text.slice(cursor, match.index));
                    parts.push(<mark className="key-highlight" key={`term-${match.index}`}>{match[0]}</mark>);
                    cursor = match.index + match[0].length;
                }
                if (cursor < text.length) parts.push(text.slice(cursor));
                return parts.length > 0 ? parts : text;
            };

            const renderFilterSections = () => (
                <>
                    <section className="bg-[#16161e] rounded-xl border border-[#2e2e3e] overflow-hidden">
                        <div className="px-4 py-3 border-b border-[#2e2e3e] flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-blue-500 inline-block"></span><h2 className="text-sm font-bold text-white">หลักฐาน</h2></div>
                            <span className="text-xs text-[#85859b]">{evidenceTypes.length} รายการ</span>
                        </div>
                        <div className="p-3 flex flex-wrap gap-2">
                            {evidenceTypes.map(ev => renderFilterChoice("evidence", ev, evidenceState[ev], () => toggleEvidence(ev)))}
                        </div>
                    </section>

                    <section className="bg-[#16161e] rounded-xl border border-[#2e2e3e] overflow-hidden">
                        <div className="px-4 py-3 border-b border-[#2e2e3e] flex items-center justify-between gap-2">
                            <div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-amber-500 inline-block"></span><h2 className="text-sm font-bold text-white">พฤติกรรม</h2></div>
                            <span className="text-xs text-[#85859b]">{traitTypes.length} รายการ</span>
                        </div>
                        <div className="p-2 space-y-1">
                            {traitGroups.map(group => {
                                const isExpanded = !!expandedTraitGroups[group.id];
                                const selectedCount = group.traits.filter(t => traitState[t] !== 0).length;
                                const eliminatedCount = group.traits.filter(t => getFilterAvailability("trait", t, traitState[t]) === "eliminated").length;
                                const confirmedCount = group.traits.filter(t => getFilterAvailability("trait", t, traitState[t]) === "confirmed").length;
                                return (
                                    <div key={group.id} className="rounded-lg overflow-hidden">
                                        <button type="button" aria-expanded={isExpanded} onClick={() => setExpandedTraitGroups(prev => ({ ...prev, [group.id]: !prev[group.id] }))} className="w-full flex items-center justify-between gap-2 text-left px-3 py-2.5 rounded-lg bg-[#1e1e28] hover:bg-[#252530] transition-colors">
                                            <span className="flex items-center gap-2 text-sm font-semibold text-[#e4e4ed]"><span>{group.icon}</span>{group.title}<span className="text-xs text-[#85859b] font-normal">{group.traits.length}</span></span>
                                            <span className="flex items-center gap-1.5 shrink-0">
                                                {selectedCount > 0 && <span className="text-xs font-bold text-amber-300 bg-amber-950 border border-amber-800 rounded-full px-2 py-0.5">{selectedCount} เลือก</span>}
                                                {eliminatedCount > 0 && <span className="text-xs font-bold text-red-200 bg-red-950/50 border border-dashed border-red-800 rounded-full px-2 py-0.5" title="ตัวเลือกที่ถูกตัดอัตโนมัติ">✕ {eliminatedCount}</span>}
                                                {confirmedCount > 0 && <span className="text-xs font-bold text-green-200 bg-green-950/40 border border-dashed border-green-800 rounded-full px-2 py-0.5" title="ตัวเลือกที่ตรงกับผีที่เหลือทุกตัว">✓ {confirmedCount}</span>}
                                                <span className="text-[#b4b4c8]" aria-hidden="true">{isExpanded ? "−" : "+"}</span>
                                            </span>
                                        </button>
                                        {isExpanded && <div className="p-2 flex flex-wrap gap-2">{group.traits.map(t => renderFilterChoice("trait", t, traitState[t], () => toggleTrait(t)))}</div>}
                                    </div>
                                );
                            })}
                        </div>
                    </section>
                </>
            );

            const renderFilterLegend = () => (
                <div className="bg-[#16161e] rounded-xl border border-[#2e2e3e] p-4 space-y-3">
                    <p className="text-xs font-bold text-[#85859b] uppercase tracking-wider">วิธีใช้ตัวกรอง</p>
                    <div className="space-y-2 text-sm text-[#b4b4c8]">
                        <div className="flex items-center gap-2"><span className="inline-block bg-[#1e1e28] border border-[#3a3a4e] px-2 py-1 rounded text-[#b4b4c8] font-semibold">ปกติ</span>= ยังไม่เลือก</div>
                        <div className="flex items-center gap-2"><span className="inline-block bg-[#065f46] border border-[#10b981] px-2 py-1 rounded text-[#6ee7b7] font-semibold">เขียว</span>= ต้องพบ</div>
                        <div className="flex items-center gap-2"><span className="inline-block bg-[#7f1d1d] border border-[#ef4444] px-2 py-1 rounded text-[#fca5a5] font-semibold line-through">แดง</span>= ต้องไม่มี</div>
                        <div className="flex items-center gap-2"><span className="inline-block bg-red-950/30 border border-dashed border-red-800 px-2 py-1 rounded text-red-200 font-semibold">✕ ขีดฆ่า</span>= ไม่มีในผีที่เหลือ</div>
                        <div className="flex items-center gap-2"><span className="inline-block bg-green-950/30 border border-dashed border-green-700 px-2 py-1 rounded text-green-200 font-semibold">✓ เส้นประ</span>= มีในผีที่เหลือทุกตัว</div>
                        <p className="text-xs text-[#85859b]">สถานะอัตโนมัติจะเริ่มแสดงหลังเลือกตัวกรอง</p>
                    </div>
                    <button onClick={reset} disabled={activeFilterCount === 0} className="w-full rounded-lg py-2.5 text-sm font-bold transition-all border border-[#3a3a4e] text-[#b4b4c8] hover:bg-[#1e1e28] hover:text-white disabled:opacity-30 disabled:cursor-not-allowed">↺ ล้างตัวกรองทั้งหมด</button>
                </div>
            );

            const renderGuideModal = (title, icon, dataList, onClose, accentColor) => (
                <div className="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50" onClick={onClose}>
                    <div className="bg-[#16161e] rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-[#2e2e3e] overflow-hidden" onClick={e => e.stopPropagation()}>
                        <div className="px-6 py-5 border-b border-[#2e2e3e] flex justify-between items-center shrink-0" style={{background:'linear-gradient(135deg,#1a1a26 0%,#16161e 100%)'}}>
                            <div>
                                <p className="text-xs font-semibold uppercase tracking-widest mb-1" style={{color: accentColor}}>คู่มือ</p>
                                <h2 className="text-2xl font-bold text-white">{icon} {title}</h2>
                            </div>
                            <button onClick={onClose} className="text-[#85859b] hover:text-white bg-[#1e1e28] hover:bg-[#2e2e3e] rounded-xl w-10 h-10 flex items-center justify-center text-lg font-bold transition-colors">✕</button>
                        </div>
                        <div className="p-5 overflow-y-auto space-y-4">
                            {dataList.map((guide, idx) => (
                                <div key={idx} className="bg-[#1e1e28] rounded-xl overflow-hidden border border-[#2e2e3e]">
                                    <div className="px-5 py-3 border-b border-[#2e2e3e] flex items-center gap-3">
                                        <span className="text-2xl">{guide.icon}</span>
                                        <h3 className="text-lg font-bold text-white">{guide.name}</h3>
                                    </div>
                                    <div className="p-5 grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div><p className="text-xs font-bold uppercase tracking-wider text-amber-500 mb-2">🧠 หลักการทำงาน</p><p className="modal-copy text-[#c0c0d0]">{renderHighlightedText(guide.details.concept)}</p></div>
                                        <div><p className="text-xs font-bold uppercase tracking-wider text-blue-400 mb-2">👁️ สิ่งที่มองเห็น</p><p className="modal-copy text-[#c0c0d0] whitespace-pre-line">{renderHighlightedText(guide.details.visuals)}</p></div>
                                        <div><p className="text-xs font-bold uppercase tracking-wider text-green-400 mb-2">🎯 เทคนิคการใช้</p><p className="modal-copy text-[#c0c0d0]">{renderHighlightedText(guide.details.technique)}</p></div>
                                        <div className="bg-[#1a0e0e] rounded-lg p-3 border border-[#3d1a1a]"><p className="text-xs font-bold uppercase tracking-wider text-red-400 mb-2">⚠️ ข้อควรระวัง</p><p className="modal-copy text-red-200">{renderHighlightedText(guide.details.application)}</p></div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen" style={{background:'var(--bg-base)'}}>
                    {/* ── Sticky Nav Bar ── */}
                    <header className="sticky top-0 z-40 border-b border-[#2e2e3e]" style={{background:'rgba(13,13,17,0.96)',backdropFilter:'blur(12px)'}}>
                        <div className="max-w-screen-2xl mx-auto px-4 sm:px-6">
                            <div className="flex items-center justify-between h-16 gap-4">
                                <div className="flex items-center gap-3 shrink-0">
                                    <div className="w-8 h-8 rounded-lg bg-red-900 flex items-center justify-center text-red-300 text-sm font-black border border-red-800">D</div>
                                    <div>
                                        <h1 className="text-base font-black text-white leading-none tracking-tight">DEMONOLOGIST</h1>
                                        <p className="text-xs text-[#85859b] font-medium">Pro Wiki &amp; Ghost Finder</p>
                                    </div>
                                </div>
                                <nav className="flex items-center gap-2 overflow-x-auto">
                                    <button onClick={() => setShowEvidenceModal(true)} className="nav-btn nav-btn-blue shrink-0">
                                        <span>📖</span><span className="hidden sm:inline">อุปกรณ์หาหลักฐาน</span><span className="sm:hidden">หลักฐาน</span>
                                    </button>
                                    <button onClick={() => setShowCursedModal(true)} className="nav-btn nav-btn-purple shrink-0">
                                        <span>🔮</span><span className="hidden sm:inline">ของต้องคำสาป</span><span className="sm:hidden">คำสาป</span>
                                    </button>
                                    <button onClick={() => setShowStoreModal(true)} className="nav-btn nav-btn-teal shrink-0">
                                        <span>🛒</span><span className="hidden sm:inline">อุปกรณ์ร้านค้า</span><span className="sm:hidden">ร้านค้า</span>
                                    </button>
                                </nav>
                            </div>
                        </div>
                    </header>

                    {/* ── Page Body ── */}
                    <div className="max-w-screen-2xl mx-auto px-4 sm:px-6 py-6">
                        <details className="lg:hidden mb-5 rounded-xl border border-[#2e2e3e] bg-[#16161e] overflow-hidden">
                            <summary className="flex items-center justify-between gap-3 px-4 py-3 cursor-pointer list-none">
                                <span><span className="block text-base font-bold text-white">ตัวกรองหลักฐานและพฤติกรรม</span><span className="block text-xs text-[#85859b]">แตะเพื่อเลือกสิ่งที่พบหรือไม่พบ</span></span>
                                <span className="shrink-0 text-right text-sm font-bold text-amber-300">{activeFilterCount > 0 ? `${activeFilterCount} เลือก` : "เปิดตัวกรอง"}{autoEliminatedCount > 0 && <span className="block text-xs font-medium text-red-300">✕ ตัดอัตโนมัติ {autoEliminatedCount}</span>}</span>
                            </summary>
                            <div className="p-3 pt-0 space-y-3">{renderFilterSections()}{renderFilterLegend()}</div>
                        </details>
                        <div className="flex gap-6 items-start">

                            {/* ── Filter Sidebar ── */}
                            <aside aria-label="ตัวกรองผี" className="w-72 shrink-0 sticky top-20 max-h-[calc(100vh-6rem)] overflow-y-auto space-y-4 hidden lg:block">
                                <div className="flex items-center justify-between">
                                    <div><p className="text-base font-bold text-white">ตัวกรอง</p><p className="text-xs text-[#85859b]">ซ่อนตัวเลือกที่ไม่ตรงทันที</p></div>
                                    <div className="flex flex-col items-end gap-1">
                                        {activeFilterCount > 0 && <span className="text-xs font-bold bg-amber-900 text-amber-300 border border-amber-700 px-2.5 py-1 rounded-full">{activeFilterCount} เลือก</span>}
                                        {autoEliminatedCount > 0 && <span className="text-xs font-semibold text-red-300" title="จำนวนตัวเลือกที่ไม่มีในผีที่เหลือ">✕ ตัดอัตโนมัติ {autoEliminatedCount}</span>}
                                    </div>
                                </div>
                                {renderFilterSections()}
                                {renderFilterLegend()}
                            </aside>

                            {/* ── Ghost Grid ── */}
                            <main className="flex-1 min-w-0">
                                <section aria-live="polite" className="mb-5 rounded-2xl border border-[#2e2e3e] bg-gradient-to-br from-[#1b1b25] to-[#14141b] p-5 sm:p-6 shadow-lg">
                                    <div className="flex flex-wrap items-center justify-between gap-4">
                                        <div>
                                            <p className="text-sm font-bold text-[#b4b4c8] mb-1">ภาพรวมผลการคัดกรอง</p>
                                            <div className="flex items-baseline gap-2">
                                                <span className="text-4xl sm:text-5xl font-black text-white leading-none">{possibleGhosts.length}</span>
                                                <span className="text-base text-[#b4b4c8]">จาก {ghosts.length} ตัว</span>
                                            </div>
                                        </div>
                                        <div className={`rounded-xl border px-4 py-3 ${possibleGhosts.length === 0 ? 'bg-red-950/50 border-red-900' : possibleGhosts.length <= 3 ? 'bg-green-950/50 border-green-900' : 'bg-[#1e1e28] border-[#3a3a4e]'}`}>
                                            <p className="text-sm text-[#b4b4c8]">{activeFilterCount === 0 ? "สถานะ" : "ตัวกรองที่เลือก"}</p>
                                            <p className="text-lg font-bold text-white">{activeFilterCount === 0 ? "ยังไม่ได้กรอง" : `${activeFilterCount} รายการ`}</p>
                                            {autoEliminatedCount > 0 && <p className="text-xs text-red-300 mt-1">✕ ระบบตัดช้อยแล้ว {autoEliminatedCount} ข้อ</p>}
                                        </div>
                                    </div>
                                    <div className="border-t border-[#2e2e3e] mt-4 pt-4">
                                        {activeFilterEntries.length > 0 ? <>
                                            <p className="text-xs font-bold text-[#85859b] mb-2 uppercase tracking-wider">เงื่อนไขที่กำลังใช้</p>
                                            <div className="flex flex-wrap gap-2">{activeFilterEntries.map(item => <span key={item.label} className={`inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1 text-sm border ${item.value === 1 ? 'bg-green-950/60 text-green-200 border-green-800' : 'bg-red-950/60 text-red-200 border-red-800'}`}><span aria-hidden="true">{item.value === 1 ? "✓" : "✕"}</span>{item.label}</span>)}</div>
                                        </> : <p className="text-sm text-[#b4b4c8]">เลือกหลักฐานหรือพฤติกรรมทางด้านซ้ายเพื่อเริ่มคัดกรอง</p>}
                                    </div>
                                </section>

                                <div className="flex items-end justify-between gap-3 mb-4">
                                    <div>
                                        <h2 className="text-xl sm:text-2xl font-bold text-white">ผีที่ตรงกับตัวกรอง</h2>
                                        <p className="text-sm text-[#85859b] mt-1">คลิกการ์ดเพื่ออ่านคู่มือและพฤติกรรมโดยละเอียด</p>
                                    </div>
                                    <span className="text-sm font-bold text-[#b4b4c8] shrink-0">{possibleGhosts.length} รายการ</span>
                                </div>

                                {possibleGhosts.length > 0 ? (
                                    <div className="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-3">
                                        {possibleGhosts.map(ghost => (
                                            <div key={ghost.name} onClick={() => setSelectedGhost(ghost)} className="ghost-card possible p-5">
                                                <div className="flex items-start justify-between mb-3">
                                                    <h3 className="text-xl font-black text-white leading-tight">{ghost.name}</h3>
                                                    <span className="text-xs font-semibold text-[#85859b] bg-[#1e1e28] px-2 py-1 rounded-lg border border-[#2e2e3e] shrink-0 ml-2">👁 ดูคู่มือ</span>
                                                </div>
                                                <div className="mb-3">
                                                    <p className="text-xs font-semibold text-[#85859b] mb-1.5 uppercase tracking-wider">หลักฐาน</p>
                                                    <div>{ghost.evidence.map(ev => <span key={ev} className={`tag evidence ${evidenceState[ev] === 1 ? 'match' : ''}`}>{ev}</span>)}</div>
                                                </div>
                                                {ghost.traits && ghost.traits.length > 0 && (
                                                    <div>
                                                        <p className="text-xs font-semibold text-[#85859b] mb-1.5 uppercase tracking-wider">พฤติกรรมเด่น</p>
                                                        <div>{ghost.traits.map(t => <span key={t} className={`tag trait ${traitState[t] === 1 ? 'match' : ''}`}>{t}</span>)}</div>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="rounded-xl border border-[#2e2e3e] bg-[#16161e] p-12 text-center">
                                        <p className="text-3xl mb-3">🔍</p>
                                        <p className="font-bold text-white mb-1">ไม่พบวิญญาณที่ตรงกัน</p>
                                        <p className="text-sm text-[#85859b]">ลองปรับตัวกรองหรือกด "ล้างตัวกรองทั้งหมด"</p>
                                    </div>
                                )}
                            </main>
                        </div>
                    </div>

                    {/* ── Ghost Detail Modal ── */}
                    {selectedGhost && (
                        <div className="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50" onClick={() => setSelectedGhost(null)}>
                            <div className="bg-[#16161e] rounded-2xl max-w-2xl w-full max-h-[88vh] flex flex-col shadow-2xl border border-[#2e2e3e] overflow-hidden" onClick={e => e.stopPropagation()}>
                                <div className="px-6 py-5 border-b border-[#2e2e3e] flex justify-between items-start shrink-0" style={{background:'linear-gradient(135deg,#200d0d 0%,#16161e 100%)'}}>
                                    <div>
                                        <p className="text-xs font-semibold text-red-500 uppercase tracking-widest mb-1">คู่มือวิเคราะห์เชิงลึก</p>
                                        <h2 className="text-3xl font-black text-white leading-tight">{selectedGhost.name}</h2>
                                        <div className="flex flex-wrap gap-1.5 mt-3">{selectedGhost.evidence.map(ev => <span key={ev} className="tag evidence">{ev}</span>)}</div>
                                    </div>
                                    <button onClick={() => setSelectedGhost(null)} className="text-[#85859b] hover:text-white bg-[#1e1e28] hover:bg-[#2e2e3e] rounded-xl w-10 h-10 flex items-center justify-center text-lg font-bold shrink-0 ml-4 mt-1 transition-colors">✕</button>
                                </div>
                                <div className="p-5 overflow-y-auto space-y-3">
                                    <div className="bg-[#1e1e28] rounded-xl p-4 border-l-4 border-amber-500">
                                        <h3 className="text-xs font-bold uppercase tracking-wider text-amber-500 mb-2">🧠 หลักการและแนวคิด</h3>
                                        <p className="modal-copy text-[#c0c0d0]">{renderHighlightedText(selectedGhost.details.concept)}</p>
                                    </div>
                                    <div className="bg-[#1e1e28] rounded-xl p-4 border-l-4 border-blue-500">
                                        <h3 className="text-xs font-bold uppercase tracking-wider text-blue-400 mb-2">👁️ ภาพจำและพฤติกรรม</h3>
                                        <p className="modal-copy text-[#c0c0d0]">{renderHighlightedText(selectedGhost.details.visuals)}</p>
                                    </div>
                                    <div className="bg-[#1e1e28] rounded-xl p-4 border-l-4 border-green-500">
                                        <h3 className="text-xs font-bold uppercase tracking-wider text-green-400 mb-2">🎯 เทคนิคทดสอบและสังเกต</h3>
                                        <p className="modal-copy text-[#c0c0d0]">{renderHighlightedText(selectedGhost.details.technique)}</p>
                                    </div>
                                    <div className="bg-[#1a0e0e] rounded-xl p-4 border-l-4 border-red-500 border border-[#3d1a1a]">
                                        <h3 className="text-xs font-bold uppercase tracking-wider text-red-400 mb-2">⚠️ ข้อควรระวังและการประยุกต์</h3>
                                        <p className="modal-copy text-red-200">{renderHighlightedText(selectedGhost.details.application)}</p>
                                    </div>
                                    {selectedGhost.traits && selectedGhost.traits.length > 0 && (
                                        <div className="bg-[#1e1a10] rounded-xl p-4 border border-[#3d2e10]">
                                            <h3 className="text-xs font-bold uppercase tracking-wider text-amber-400 mb-2">★ พฤติกรรมเด่น</h3>
                                            <div>{selectedGhost.traits.map(t => <span key={t} className="tag trait">{t}</span>)}</div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {showEvidenceModal && renderGuideModal("อุปกรณ์หาหลักฐาน", "📖", evidenceGuides, () => setShowEvidenceModal(false), "#60a5fa")}
                    {showCursedModal && renderGuideModal("ของต้องคำสาป", "🔮", cursedItemsGuides, () => setShowCursedModal(false), "#a78bfa")}
                    {showStoreModal && renderGuideModal("อุปกรณ์ร้านค้า", "🛒", storeItemsGuides, () => setShowStoreModal(false), "#34d399")}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
